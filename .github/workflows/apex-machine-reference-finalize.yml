name: APEX machine reference finalize
on: {push: {branches: [main], paths: [.github/workflows/apex-machine-reference-finalize.yml]}}
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - shell: python
        run: |
          from pathlib import Path
          old='canon'+'ical'; exts={'.md','.json','.yaml','.yml','.py','.mjs','.js','.ts','.tsx','.toml','.txt','.csv','.sh','.ps1'}
          pairs=((f'machine/{old}-position-proof.json','machine/apex-position-proof.json'),(f'machine/{old}-position.json','machine/apex-position.json'),(f'{old}_position','apex_position'),(f'{old}-position','apex-position'),(f'{old}.position','apex.position'))
          for p in Path('.').rglob('*'):
            if p.is_file() and p.suffix.lower() in exts and '.git' not in p.parts and p.as_posix()!='.github/workflows/apex-machine-reference-finalize.yml':
              t=p.read_text(encoding='utf-8',errors='ignore'); u=t
              for a,b in pairs: u=u.replace(a,b).replace(a.upper(),b.upper())
              if u!=t: p.write_text(u,encoding='utf-8')
          for s in ('-position.json','-position-proof.json'):
            src=Path('machine')/f'{old}{s}'; dst=Path('machine')/f'apex{s}'
            if src.exists(): src.unlink() if dst.exists() else src.rename(dst)
          needle=f'machine/{old}-position'; bad=[p.as_posix() for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.as_posix()!='.github/workflows/apex-machine-reference-finalize.yml' and needle in p.read_text(encoding='utf-8',errors='ignore').lower()]
          if bad: raise SystemExit(','.join(bad))
      - run: |
          rm .github/workflows/apex-machine-reference-finalize.yml
          git config user.name "GlacierEQ APEX Migration"; git config user.email "actions@users.noreply.github.com"
          git add -A; git diff --cached --quiet && exit 0
          git commit -m "APEX: finalize machine authority references"; git push origin HEAD:main
